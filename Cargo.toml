[package]
name = "vekrel-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
form_urlencoded = "1.2"
getrandom = "0.3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
p256 = { version = "0.14", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "migrate", "macros", "uuid"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
# Test-only RS256 keys for the fake Google (both already in the tree through jsonwebtoken).
rand = "0.8"
rsa = "0.9"
tower = { version = "0.5.3", features = ["util"] }

# Test-only RSA key generation (fake Google) is very slow unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
