{% extends "_layout.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in to Vekrel</h1>
{% if github %}<a class="button" href="/auth/github">Continue with GitHub</a>{% endif %}
{% if google %}<a class="button" href="/auth/google">Continue with Google</a>{% endif %}
{% if github || google %}<div class="or">or</div>{% endif %}
<form method="post" action="/auth/email">
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<button class="primary" type="submit">Email me a sign-in link</button>
</form>
{% endblock %}
