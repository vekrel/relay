<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · Vekrel</title>
<style>
:root { color-scheme: light dark; --ink: #1C1E22; --paper: #F4F1EC; --tile: #FF6A2B; --line: #E4DED6; --card: #FFFFFF; --muted: #5B5F67; }
@media (prefers-color-scheme: dark) { :root { --ink: #F4F1EC; --paper: #1C1E22; --line: #3B3E46; --card: #24262B; --muted: #A8ABB2; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 "Avenir Next", Avenir, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { width: min(380px, calc(100vw - 32px)); padding: 32px 28px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
header svg { width: 36px; height: 36px; }
header span { font-weight: 700; font-size: 22px; letter-spacing: -0.035em; }
h1 { font-size: 20px; margin: 0 0 16px; }
p { margin: 0 0 16px; color: var(--muted); }
.button, button { display: block; width: 100%; padding: 11px 14px; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
.button:hover, button:hover { border-color: var(--tile); }
.button:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--tile); outline-offset: 2px; }
button.primary { background: var(--tile); border-color: var(--tile); color: #1C1E22; }
.or { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--muted); font-size: 14px; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
input { display: block; width: 100%; padding: 10px 12px; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); font: inherit; }
</style>
</head>
<body>
<main>
<header><svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="t"><rect x="4" y="4" width="92" height="92" rx="24"/></clipPath></defs><g clip-path="url(#t)"><rect width="100" height="100" fill="#FF6A2B"/><rect x="13" y="24" width="56" height="46" rx="6" fill="#24262B"/><rect x="13" y="24" width="56" height="9" rx="6" fill="#3B3E46"/><rect x="13" y="29" width="56" height="4" fill="#3B3E46"/><rect x="55" y="40" width="31" height="46" rx="7" fill="#FFF3E8"/><rect x="55" y="40" width="14" height="30" fill="#FFD9C2"/><rect x="21" y="52" width="58" height="9" rx="4.5" fill="#5CFFB0"/></g></svg><span>Vekrel</span></header>
{% block content %}{% endblock %}
</main>
</body>
</html>
